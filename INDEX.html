<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B1220"><title>Trilha do Conhecimento • Regimes Aduaneiros Especiais</title>
<style>
:root{--bg-900:#0B1220;--bg-800:#121A2B;--glass-fill:rgba(255,255,255,.08);--glass-fill-2:rgba(255,255,255,.13);--glass-stroke:rgba(255,255,255,.18);--glass-blur:18px;--text-100:#F4F7FB;--text-300:#C3CCDA;--text-500:#8C98AC;--success:#22C55E;--error:#EF4444;--warn:#F59E0B;--info:#38BDF8;--r-sm:10px;--r-md:16px;--r-lg:24px;--r-pill:999px;--shadow-1:0 4px 16px rgba(0,0,0,.25);--shadow-2:0 12px 40px rgba(0,0,0,.35);--gap:clamp(12px,2.5vw,24px);--accent:#2563EB;--accent-2:#38BDF8;--font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 10%,#2563eb14,transparent 55%),var(--bg-900);color:var(--text-100);font:16px/1.65 var(--font-ui);min-height:100vh}body:before,body:after{content:"";position:fixed;width:32vw;height:32vw;background:var(--accent);filter:blur(100px);opacity:.07;border-radius:50%;pointer-events:none;z-index:-1}body:after{right:0;bottom:0}button,input,textarea{font:inherit}button{min-height:44px;border:1px solid var(--glass-stroke);border-radius:var(--r-sm);background:var(--glass-fill);color:var(--text-100);padding:12px 20px;cursor:pointer;transition:background .2s,transform .2s}button:hover:enabled{background:var(--glass-fill-2);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);color:#FFFFFF;font-weight:800;border:0}.primary:hover:enabled{background:var(--accent-2);color:#071824}:focus-visible{outline:3px solid var(--accent-2);outline-offset:4px}a{color:var(--accent-2)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.1rem,5vw,4rem);line-height:1.1;letter-spacing:-.045em;margin-bottom:20px}h2{font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.2}h3{line-height:1.3}.muted{color:var(--text-300)}.eyebrow{color:var(--accent-2);font:700 .8rem var(--font-mono);letter-spacing:.13em;text-transform:uppercase;margin-bottom:16px}.shell{width:min(1100px,100%);margin:auto;padding:36px 24px 120px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:42px;color:var(--text-300);font-size:.9rem}.brand svg{width:40px;height:40px;color:var(--accent-2)}.glass-card{background:var(--glass-fill);border:1px solid var(--glass-stroke);border-radius:var(--r-lg);padding:clamp(20px,3vw,32px);backdrop-filter:blur(var(--glass-blur));box-shadow:var(--shadow-1)}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center}.hero-subtitle{font-size:1.4rem;color:var(--accent-2)}.chip{display:inline-block;border:1px solid var(--glass-stroke);border-radius:var(--r-pill);padding:5px 12px;font-size:.8rem;color:var(--text-300);margin:0 6px 8px 0}.field-label{display:block;font-weight:650;margin:16px 0 8px}input,textarea{width:100%;min-width:0;background:#0b1220b3;border:1px solid var(--glass-stroke);border-radius:var(--r-sm);padding:14px;color:var(--text-100)}textarea{min-height:330px;resize:vertical;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.actions button{flex-shrink:1}.hud{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;background:#121a2bf2;border:1px solid var(--glass-stroke);border-radius:var(--r-pill);box-shadow:var(--shadow-2);padding:12px 22px;z-index:5;font-size:.85rem;font-family:var(--font-mono)}.hud-item{white-space:nowrap}.station-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);margin:28px 0}.station-card{display:flex;flex-direction:column;gap:10px}.station-card button{margin-top:auto}.station-num{font:700 2.5rem var(--font-mono);color:var(--accent-2)}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 28px}.step{padding:7px 12px;border-radius:var(--r-pill);color:var(--text-300);background:var(--glass-fill);font-size:.85rem}.step--active{border:1px solid var(--accent-2);color:var(--accent-2)}.narrative{max-width:850px;margin:auto}.narrative section{margin:0 0 28px}.command{border-left:3px solid var(--accent-2);background:var(--glass-fill);padding:24px;border-radius:var(--r-md)}.quiz-card{margin:18px 0}.quiz-alt{display:block;width:100%;text-align:left;margin-top:10px;opacity:1!important}.quiz-alt:disabled{color:var(--text-300)}.quiz-alt--correta{border:2px solid var(--success);background:#22c55e14;color:var(--text-100)!important}.quiz-alt--errada{border:2px solid var(--error);background:#ef444414;color:var(--text-100)!important}.feedback{padding:16px;border-radius:var(--r-sm);background:var(--glass-fill);margin-top:16px;color:var(--text-300)}.writing-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--gap);align-items:start}.tips{position:sticky;top:20px}.tip{padding:10px 0;border-bottom:1px solid var(--glass-stroke);color:var(--text-300)}.tip--done{opacity:.65}.counter{font-family:var(--font-mono);color:var(--warn);margin-top:8px}.counter--ok{color:var(--success)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}.metric strong{display:block;font-size:1.8rem;color:var(--accent-2)}.metric{padding:18px;background:var(--glass-fill);border-radius:var(--r-md);font-size:.85rem}.grade{font-size:clamp(3rem,9vw,6rem);line-height:1.2;color:var(--accent-2);font-weight:800}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));padding:16px 22px;background:#173344;border:1px solid var(--accent-2);border-radius:var(--r-md);box-shadow:var(--shadow-2);z-index:20}.toast:empty{display:none}.storage-warning{color:var(--warn);font-size:.85rem}.fullscreen-card{max-width:700px;margin:40px auto}.fullscreen-card h1{font-size:clamp(2rem,5vw,3rem)}.confetti{font-size:2rem;letter-spacing:12px;animation:celebrate 1s ease-out}@keyframes celebrate{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}.footer{margin-top:40px;font-size:.8rem;color:var(--text-300)}@media(max-width:720px){.hero,.station-grid,.writing-grid{grid-template-columns:1fr}.shell{padding:24px 16px 140px}.brand{margin-bottom:28px}.tips{position:static}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.hud{border-radius:var(--r-md);gap:5px 14px;font-size:.73rem}.actions button{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><div class="shell"><header class="brand"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 15 24 6l16 9v18l-16 9L8 33Z M8 15l16 9 16-9M24 24v18" stroke="currentColor" stroke-width="2.5"/><path d="m17 11 15 9" stroke="currentColor" stroke-width="2.5"/></svg><span>EDUCAÇÃO PROFISSIONAL PAULISTA<br><b>Trilha do Conhecimento</b></span></header><div id="storageAviso" class="storage-warning" role="status"></div><main id="app"></main><footer class="footer">Regimes Aduaneiros · Técnico em Logística<br>Professor Magno Vieira dos Santos<br></footer></div><aside id="hud" class="hud" aria-label="Progresso da missão"></aside><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const CONFIG=Object.freeze({tema:'Regimes Aduaneiros Especiais',slug:'regimes-aduaneiros-especiais',disciplina:'Regimes Aduaneiros',turma:'',numEstacoes:2,questoesPorEstacao:3,minCaracteres:300,pesoVacilo:1,tetoVacilos:3});
const ESTACOES=[{"titulo": "Drawback: escolha o regime certo", "sub": "Exportação, incentivos e modalidades de benefício", "icone": "01", "narrativa": [["Você recebeu uma missão internacional", "{NOME}, imagine que você integra a equipe de uma fábrica de bolsas de couro artesanais que pretende exportar. Antes de montar o plano, você precisa compreender por que a empresa procura o mercado externo. O material aponta quatro fatores: a alta do dólar, que torna a receita de exportação mais rentável quando convertida para a moeda nacional; os incentivos fiscais; a diversificação de mercados e clientes; e a redução da dependência do mercado interno em momentos de retração econômica local. Seu desafio é relacionar esses fatores à operação, sem confundir incentivo com dispensa de obrigações."], ["Regimes especiais: finalidade e custos", "Os regimes aduaneiros especiais são regimes tributários e procedimentos fiscais diferenciados concedidos pela administração pública às empresas envolvidas no comércio exterior. Segundo o material, eles podem simplificar o pagamento de tributos, permitir suspensão ou isenção de impostos e oferecer prazos diferenciados para o recolhimento. Sua finalidade é reduzir o custo total de fabricação dos bens exportados, otimizar o fluxo de caixa e eliminar a acumulação de resíduos tributários, como ICMS, IPI, PIS/COFINS e Imposto de Importação. O estudo também relaciona esses benefícios à redução do Custo Total de Aquisição."], ["O insumo e a exportação se conectam", "O Drawback desonera insumos adquiridos no mercado interno ou importados para a industrialização de produtos destinados à exportação. O material o apresenta como o incentivo fiscal de maior relevância no comércio exterior brasileiro. Na sua fábrica, o couro é o insumo a ser relacionado à fabricação das bolsas. O benefício precisa ser entendido a partir do momento em que os tributos são suspensos, dispensados na reposição ou devolvidos. Essa diferença ajuda você a distinguir as três modalidades ordinárias."], ["Suspensão: compromisso com a exportação futura", "Na modalidade Suspensão, a empresa adquire ou importa insumos sem pagar imediatamente os tributos, sob a condição de fabricar o produto final no país e efetivamente exportá-lo. O exemplo do material é uma indústria calçadista que importa couro para produzir sapatos destinados ao exterior. A matriz comparativa também cita uma indústria têxtil que importa tecidos para confeccionar roupas a serem exportadas. O benefício ocorre antes da fabricação e da exportação: existe um compromisso que precisa ser cumprido."], ["Isenção e Restituição: olhe para o que já ocorreu", "Na Isenção, a empresa repõe, com isenção tributária, o estoque de insumos já utilizado na fabricação de bens previamente exportados. No exemplo, a empresa recompra couro para recompor o estoque consumido na exportação realizada. Na Restituição, a empresa pede o reembolso de tributos já pagos na importação de insumos aplicados em produtos exportados; o material informa que essa modalidade é pouco utilizada. Uma montadora que pagou tributos na importação de motores pode solicitar a devolução depois da industrialização e da exportação dos veículos. Repor estoque com isenção e recuperar tributos pagos são mecanismos diferentes."], ["Base legal, gestores e acesso", "O material situa a instituição do Drawback no artigo 78 do Decreto-Lei nº 37, de 18 de novembro de 1966. Suspensão e Isenção são geridas e concedidas pela Secretaria de Comércio Exterior (SECEX), do Ministério do Desenvolvimento, Indústria, Comércio e Serviços (MDIC). A Restituição é administrada pela Receita Federal do Brasil (RFB). Para utilizar o regime, a empresa precisa estar habilitada no SISCOMEX, com habilitação no RADAR, sigla de Rastreamento da Atuação dos Intermediários Aduaneiros."], ["Situações atípicas e outros mecanismos citados", "O material também apresenta duas modalidades atípicas: industrialização de embarcações, com insumos para fabricação, reparo ou conversão de embarcações e navios para exportação; e fornecimento no mercado interno decorrente de licitação internacional, chamado Módulo Azul e enquadrado no mecanismo de Suspensão. Simples Nacional e ICMS-ST aparecem apenas como mecanismos complementares citados no estudo. Como contexto econômico, o material informa que couro e seus artefatos estão entre os 15 grupos principais da CUCI e registra US$ 3,80 bilhões em operações vinculadas ao Drawback no segmento de couros, no período de análise de 2021 a 2025, com destaque para posições como a NCM 4201.00.10. Esses dados são apresentados conforme o arquivo fornecido."], ["Você no comando: compare antes de escolher", "{NOME}, prepare um esboço para a exportação das bolsas. Apresente os motivos para exportar, explique a finalidade dos regimes especiais e diferencie Suspensão, Isenção e Restituição pelo momento e pelo mecanismo do benefício. Identifique quem administra cada modalidade e lembre a habilitação exigida. Apreciar a complexidade dessa tarefa e persistir na análise também são competências da missão."]], "questoes": [["Uma indústria pretende adquirir couro com suspensão de tributos para fabricar no país bolsas que ainda serão exportadas. Qual modalidade corresponde ao cenário?", ["Drawback Isenção, pois o objetivo é recompor insumos de uma exportação já realizada.", "Drawback Restituição, pois o objetivo é recuperar tributos já pagos na importação.", "Drawback Suspensão, pois a aquisição antecede a fabricação e a exportação comprometidas.", "Módulo Azul, pois toda exportação de bolsas decorre de licitação internacional."], 2, "Na Suspensão, a aquisição ou importação ocorre sem pagamento imediato dos tributos, condicionada à fabricação no país e à efetiva exportação do produto final."], ["Qual alternativa diferencia corretamente Isenção e Restituição?", ["Isenção permite repor insumos utilizados em bens já exportados; Restituição permite pedir o reembolso de tributos de importação já pagos.", "Isenção devolve tributos pagos, enquanto Restituição apenas recompõe estoque com novos insumos isentos.", "As duas modalidades concedem suspensão antes de qualquer fabricação ou exportação.", "Isenção é destinada somente à importação de motores, e Restituição somente à compra de couro."], 0, "A Isenção desonera a reposição de estoque consumido em bens previamente exportados. A Restituição consiste no reembolso de tributos pagos na importação de insumos empregados em produtos exportados."], ["Segundo o material, qual associação entre gestores e habilitação está correta?", ["A RFB concede Suspensão e Isenção, sem necessidade de habilitação no SISCOMEX.", "A SECEX administra as três modalidades, e a habilitação é exigida apenas depois da exportação.", "O RADAR substitui o gestor de cada modalidade e concede o benefício sem participação dos órgãos públicos.", "A SECEX gere Suspensão e Isenção; a RFB administra Restituição; a empresa precisa de habilitação no SISCOMEX/RADAR."], 3, "O material atribui Suspensão e Isenção à SECEX/MDIC e Restituição à RFB. Também exige habilitação da empresa no SISCOMEX, por meio do RADAR, para acesso ao regime."]], "atividade": "Elabore o esboço de um plano para a exportação de bolsas de couro artesanais. Apresente dois motivos para exportar e explique como os regimes especiais se relacionam aos custos e ao fluxo de caixa. Diferencie Drawback Suspensão, Isenção e Restituição, considerando o momento e o mecanismo do benefício. Justifique qual modalidade corresponde à aquisição de couro para uma exportação futura e identifique os gestores e a habilitação necessária. Use somente as informações do material, sem inventar valores ou prazos.", "dicas": [["Relacione a exportação aos motivos estratégicos e econômicos.", ["câmbio", "dólar", "mercados", "clientes", "dependência"]], ["Explique a finalidade dos regimes em relação aos custos ou ao caixa.", ["custos", "tributos", "caixa", "desoneração"]], ["Justifique a Suspensão para a fabricação e a exportação futuras.", ["suspensão", "fabricar", "fabricação", "futura"]], ["Diferencie a reposição com Isenção do reembolso na Restituição.", ["isenção", "reposição", "restituição", "reembolso"]], ["Identifique os gestores e a habilitação de acesso.", ["secex", "rfb", "receita federal", "siscomex", "radar"]]]}, {"titulo": "Da autorização à entrega: missão em risco", "sub": "Fluxos, documentos e resposta aos imprevistos da exportação", "icone": "02", "narrativa": [["Organize o caminho da Suspensão", "{NOME}, a fábrica de bolsas precisa transformar a escolha do regime em uma operação acompanhada. No fluxo de Suspensão descrito no material, a empresa registra o pedido no SISCOMEX; a SECEX analisa a proposta e defere o Ato Concessório (AC); a beneficiária adquire ou importa insumos com suspensão do pagamento de tributos; depois industrializa os produtos. Em seguida, realiza a exportação direta ou indireta registrada pela Declaração Única de Exportação (DU-E), entrega as mercadorias aos compradores no exterior e apresenta a comprovação. A SECEX atesta a conformidade e encerra formalmente o AC. O benefício depende de toda essa sequência."], ["Compare os outros fluxos operacionais", "No fluxo da Isenção, primeiro a empresa adquire insumos recolhendo normalmente os tributos. Depois industrializa e exporta os bens amparados pela DU-E. Com as exportações comprovadas, registra no SISCOMEX o pedido do benefício. A SECEX valida notas e comprovantes e concede o AC de Isenção. A reposição desonerada utiliza novos insumos em quantidade e qualidade equivalentes aos consumidos. Na Restituição, após pagar os tributos de importação, industrializar e exportar, a empresa apresenta pedido administrativo à RFB para obter a devolução dos valores em espécie ou crédito tributário."], ["Documentos: comércio, transporte e carga", "A Fatura Comercial, ou Commercial Invoice, formaliza a transação internacional e discrimina mercadorias, valores unitários e totais, moeda e condições de venda, incluindo Incoterms. O material apresenta o Conhecimento de Embarque como Bill of Lading (BL) ou Air Waybill (AWB), emitido pela transportadora internacional, e lhe atribui as funções de comprovante de recepção da carga, contrato de transporte e título de posse da mercadoria. A Lista de Romaneio, ou Packing List, detalha a arrumação da carga, as embalagens, o conteúdo de cada volume, os pesos bruto e líquido e as dimensões. Na sua conferência, diferencie a transação comercial da organização física dos volumes."], ["Documentos: trânsito e registros aduaneiros", "A NF-e acoberta o trânsito da mercadoria no território brasileiro até o recinto alfandegado ou a fábrica. No quadro do material, a DU-E é o documento eletrônico registrado no Portal Único Siscomex para autorizar, fiscalizar e formalizar a saída de mercadorias junto à RFB. A Declaração Única de Importação (DUIMP) é apresentada como documento eletrônico do Portal Único que substitui a antiga DI/DSI para instruir e registrar o despacho aduaneiro de importação. Você deve conferir a função de cada documento e manter as informações coerentes ao longo da operação."], ["O acompanhamento não termina no embarque", "Segundo o material, o Governo Federal cruza as informações dos Atos Concessórios com notas fiscais e DU-Es no Portal Único Siscomex. Se a empresa não comprovar a exportação no prazo de validade do AC, o benefício é descaracterizado e ela fica sujeita ao recolhimento dos tributos suspensos, acrescidos de juros de mora e multas. Por isso, a gestão precisa acompanhar o prazo, a produção, a exportação e a documentação, em vez de tratar o benefício como uma etapa isolada."], ["Dois imprevistos ao mesmo tempo", "O estudo de caso coloca sua equipe diante de dois desafios: o lote de couro está retido no porto em razão de intempéries climáticas no transporte marítimo internacional, ameaçando zerar o estoque e comprometer o cronograma; ao mesmo tempo, o designer de moda responsável pelo projeto está afastado por licença médica. O material orienta agir com resiliência e persistência e reorganizar o cronograma interno de produção para evitar o atraso na entrega final. Considere os dois problemas ao comunicar a situação e reorganizar o trabalho, sem inventar procedimentos ou soluções técnicas ausentes do estudo."], ["Resposta à crise e conformidade", "Entre as estratégias do material está a solicitação preventiva de prorrogação da validade do AC no Siscomex perante a SECEX, fundamentada no evento de força maior ou caso fortuito relacionado ao atraso marítimo por fatores climáticos. Solicitar a prorrogação não equivale a considerá-la automaticamente concedida. Outra frente é garantir o alinhamento entre Fatura Comercial, Packing List e DU-E, evitando inconsistências documentais e penalidades. Sua proposta deve combinar o replanejamento da produção, o acompanhamento do pedido de prorrogação e a conferência das informações."], ["Você no comando: apresente uma resposta coordenada", "{NOME}, explique como a fábrica deve acompanhar a operação desde o pedido até a baixa do AC e como reagir aos imprevistos apresentados. Relacione os documentos às suas funções, mantenha a coerência entre eles e deixe claro o risco de não comprovar a exportação no prazo. Construa uma resposta fundamentada no material, com resiliência, persistência e atenção às tarefas complexas."]], "questoes": [["Qual sequência corresponde ao fluxo de Drawback Suspensão apresentado no material?", ["Reposição isenta, exportação, compra tributada e pedido de reembolso à RFB.", "Pedido no SISCOMEX, deferimento do AC pela SECEX, aquisição com suspensão, industrialização, exportação pela DU-E, entrega e comprovação para baixa do AC.", "Compra com tributos, pedido de restituição, industrialização e encerramento do AC antes de exportar.", "Industrialização, baixa do AC, pedido no SISCOMEX e aquisição dos insumos depois da entrega."], 1, "O fluxo começa pelo pedido no SISCOMEX e pelo deferimento do AC pela SECEX. Seguem-se aquisição com suspensão, industrialização, exportação registrada na DU-E, entrega internacional e comprovação para encerramento do AC."], ["Qual documento detalha embalagens, conteúdo dos volumes, pesos bruto e líquido e dimensões da carga?", ["Fatura Comercial, cuja função principal é detalhar a arrumação física dos volumes.", "Ato Concessório, que substitui os documentos relativos à carga.", "RADAR, que registra os pesos e as dimensões de cada embalagem.", "Packing List, também chamado Lista de Romaneio."], 3, "O Packing List descreve a arrumação da carga, suas embalagens, o conteúdo dos volumes, os pesos bruto e líquido e as dimensões. A Fatura Comercial formaliza a transação comercial internacional."], ["Diante do atraso climático do couro e do afastamento do designer, qual resposta se alinha às estratégias do material?", ["Reorganizar o cronograma, solicitar preventivamente a prorrogação do AC à SECEX e conferir o alinhamento entre Fatura Comercial, Packing List e DU-E.", "Considerar o prazo prorrogado automaticamente e dispensar a comprovação da exportação.", "Encerrar o AC antes de exportar, mantendo o cronograma original apesar dos imprevistos.", "Substituir a DU-E pelo Packing List e desconsiderar o acompanhamento dos tributos suspensos."], 0, "O estudo orienta replanejar o cronograma com resiliência e persistência, solicitar preventivamente a prorrogação fundamentada no evento climático e manter a conformidade documental. Sem a comprovação da exportação no prazo, há risco de cobrança dos tributos suspensos, juros e multas."]], "atividade": "Redija um plano de ação para a fábrica de bolsas sob Drawback Suspensão. Considere o atraso do couro por fatores climáticos e o afastamento do designer. Apresente a sequência da operação até a baixa do Ato Concessório, explique a função da Fatura Comercial, do Packing List e da DU-E e indique como conferir sua coerência. Relacione a reorganização do cronograma e a solicitação preventiva de prorrogação à SECEX ao risco de descumprimento. Demonstre resiliênc const mensagens={"aba": ["{NOME}, a rota da exportação passa por esta aba. Vamos retomar! 🚢", "Opa, {NOME}! Sua missão de comércio exterior está aqui. 📦", "{NOME}, os documentos esperam sua atenção. Vamos manter o foco! 📋", "Atenção na operação, {NOME}: saída da aba registrada. 🧭", "{NOME}, mudou de aba? Reorganize a rota da atenção. 😅", "Ei, {NOME}, seu posto nesta missão é aqui! 🚚", "{NOME}, atenção em trânsito! Volte ao plano de exportação. 🚦", "Uma parada fora da rota, {NOME}. Agora é foco no desafio! 📋"], "colar": ["{NOME}, o plano de exportação precisa das suas palavras. Digite sua ideia! ✍️", "Opa, {NOME}! Esta conferência encontrou uma colagem. Conte o que aprendeu! 📋", "{NOME}, colagem bloqueada. Sua explicação tem valor! 🧠", "Ei, {NOME}, esse texto precisa ser construído por você. Vamos tentar! 📦", "{NOME}, esse atalho não passa pela conferência. Vamos digitar! 😅", "Conhecimento autoral em primeiro lugar, {NOME}! ✍️", "A coragem de tentar vale, {NOME}! Agora construa seu próprio texto. 💡", "Alerta na missão, {NOME}: deixe a colagem de lado e explique sua decisão! 🚢"]};
function addVacilo(tipo){if(state.tela!=='estacao'||![2,3].includes(state.passoAtual)||state.finalizadoEm)return;tick();state.vacilos++;state.eventosVacilo.push({tipo,ts:new Date().toISOString()});save();hud();const options=mensagens[tipo].map((v,i)=>i).filter(i=>i!==lastVacilo[tipo]);const idx=options[Math.floor(Math.random()*options.length)];lastVacilo[tipo]=idx;toast(personalizado(mensagens[tipo][idx])+' Desconto acumulado: '+numero(Math.min(state.vacilos*CONFIG.pesoVacilo,CONFIG.tetoVacilos))+'.')}
document.addEventListener('visibilitychange',()=>{tick();if(document.hidden)addVacilo('aba');save()});window.addEventListener('pagehide',()=>{tick();save()});document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='m'){e.preventDefault();state.vacilos=0;state.eventosVacilo=[];save();hud();if(state.tela==='resultado')renderResultado();toast('Vacilos zerados. Respostas e progresso preservados.')}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='r'){e.preventDefault();if(!confirm('Apagar todo o progresso desta trilha e começar novamente?'))return;clearTimeout(tipTimer);state=novoEstado();lastTick=Date.now();save();render();toast('Trilha reiniciada com sucesso.')}});
function calcularNota(){const acertos=state.estacoes.reduce((n,e)=>n+e.respostas.filter(r=>r.correta===true).length,0),atividadesOk=state.estacoes.filter(e=>e.textoConcluido).length,totalComponentes=(CONFIG.questoesPorEstacao+1)*CONFIG.numEstacoes,notaConteudo=(acertos+atividadesOk)/totalComponentes*10,desconto=Math.min(state.vacilos*CONFIG.pesoVacilo,CONFIG.tetoVacilos),mediaFinal=Math.max(0,Math.min(10,notaConteudo-desconto));return{acertos,atividadesOk,totalComponentes,notaConteudo,desconto,mediaFinal}}
function finalizar(){if(!podeInteragir()){render();return;}if(!state.estacoes.every(e=>e.concluida))return;tick();state.finalizadoEm=state.finalizadoEm||new Date().toISOString();irPara('resultado')}
function desempenho(n){return personalizado(n>=8.5?'🚀 {NOME}, você mandou MUITO bem!':n>=6?'👍 {NOME}, foi uma boa caminhada, mas alguns conceitos ainda precisam de treino.':n>=5?'⚠️ {NOME}, deu pra passar, mas vale revisar os pontos que escaparam.':'📚 {NOME}, é hora de voltar aos estudos e revisar os materiais antes da próxima missão.')}
function data(v){return new Date(v).toLocaleString('pt-BR')}
function renderResultado(){const n=calcularNota();app.innerHTML=`<div class="eyebrow">Missão concluída · boletim</div><section class="glass-card"><h1>Seu percurso tem resultado.</h1>${n.mediaFinal>=8.5?'<div class="confetti" aria-hidden="true">🎉 📦 ✨ 🚀</div>':''}<p>${esc(state.aluno)} · ${CONFIG.tema}${CONFIG.turma?' · '+esc(CONFIG.turma):''}<br><span class="muted">${data(state.finalizadoEm)}</span></p><div class="grade">${numero(n.mediaFinal)}<span style="font-size:1.2rem"> / 10</span></div><p>${esc(desempenho(n.mediaFinal))}</p><div class="metrics"><div class="metric"><strong>${n.acertos}/${CONFIG.numEstacoes*CONFIG.questoesPorEstacao}</strong>Acertos no quiz</div><div class="metric"><strong>${n.atividadesOk}/${CONFIG.numEstacoes}</strong>Atividades concluídas</div><div class="metric"><strong>${numero(n.notaConteudo)}</strong>Nota de conteúdo</div><div class="metric"><strong>${state.vacilos}</strong>Vacilos · desconto ${numero(n.desconto)}</div><div class="metric"><strong>${formatarTempo(state.tempoTotalMs)}</strong>Tempo total</div><div class="metric"><strong>${CONFIG.numEstacoes}/${CONFIG.numEstacoes}</strong>Estações concluídas</div></div>${ESTACOES.map((e,i)=>`<p>✅ Estação ${i+1} · ${e.titulo}: ${state.estacoes[i].respostas.filter(r=>r.correta).length}/${CONFIG.questoesPorEstacao} acertos · atividade concluída.</p>`).join('')}<p class="muted">A atividade escrita recebe um componente pela conclusão. A qualidade conceitual do texto será avaliada pelo professor.</p><p><em>Este documento registra a resposta enviada pelo estudante.</em></p><div class="actions"><button id="resultadoImprimir" class="primary">🖨️ Imprimir / salvar PDF — enviar para o registro</button></div><p class="muted">Na janela de impressão, escolha “Salvar como PDF” e envie o arquivo pelo canal indicado pelo professor.</p></section>`;document.getElementById('resultadoImprimir').onclick=montarDocumentoImpressao}
function documentoImpressao(){const n=calcularNota();return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Atividade — ${esc(state.aluno)} — ${CONFIG.tema}</title><style>body{font:11pt/1.55 system-ui,sans-serif;color:#152332;max-width:190mm;margin:20px auto;padding:15px}h1{font-size:23pt}h2{font-size:17pt;border-bottom:1px solid #aaa;margin-top:28px}h3{font-size:13pt;margin-top:22px}p{margin:8px 0}.meta{background:#f1f5f9;padding:16px}.student-text{white-space:pre-wrap;overflow:visible;overflow-wrap:anywhere;word-break:break-word;height:auto;max-height:none;line-height:1.6}.question{margin:20px 0}footer{border-top:1px solid #aaa;margin-top:25px;font-size:9pt}@page{size:A4;margin:16mm}@media print{body{margin:0;padding:0;max-width:none}.print-button{display:none}.student-text{overflow:visible!important;white-space:pre-wrap!important;max-height:none!important;height:auto!important;break-inside:auto!important;page-break-inside:auto!important}.writing{break-inside:auto;page-break-inside:auto}h2,h3{break-after:avoid}}</style></head><body><button class="print-button" onclick="window.print()">Imprimir / salvar PDF</button><header><p>EDUCAÇÃO PROFISSIONAL PAULISTA · Técnico em Logística</p><h1>Trilha do Conhecimento</h1><div class="meta"><b>Estudante:</b> ${esc(state.aluno)}<br><b>Tema:</b> ${CONFIG.tema}<br><b>Disciplina:</b> ${CONFIG.disciplina}${CONFIG.turma?'<br><b>Turma:</b> '+esc(CONFIG.turma):''}<br><b>Identificação:</b> trilha-${CONFIG.slug} · v1<br><b>Início:</b> ${data(state.iniciadoEm)}<br><b>Conclusão:</b> ${data(state.finalizadoEm)}</div></header><h2>Resultado</h2><p>Acertos: ${n.acertos}/${CONFIG.numEstacoes*CONFIG.questoesPorEstacao} · Atividades concluídas: ${n.atividadesOk}/${CONFIG.numEstacoes}<br>Nota de conteúdo: ${numero(n.notaConteudo)} · Vacilos: ${state.vacilos} · Desconto: ${numero(n.desconto)}<br>Tempo total: ${formatarTempo(state.tempoTotalMs)} · <b>Média final: ${numero(n.mediaFinal)}/10</b></p><p>${esc(desempenho(n.mediaFinal))}</p><p>Fórmula: (acertos + atividades concluídas) / ${n.totalComponentes} × 10; desconto de ${numero(CONFIG.pesoVacilo)} por vacilo, limitado a ${numero(CONFIG.tetoVacilos)} pontos; nota final entre 0 e 10.</p><p>As produções escritas recebem um componente por conclusão; a qualidade conceitual depende da avaliação do professor.</p><h3>Registro de vacilos</h3>${state.eventosVacilo.length?'<ul>'+state.eventosVacilo.map(v=>'<li>'+esc(v.tipo==='aba'?'Saída da aba/página':'Tentativa de colagem')+' · '+data(v.ts)+'</li>').join('')+'</ul>':'<p>Nenhum vacilo registrado.</p>'}${ESTACOES.map((e,i)=>{const s=state.estacoes[i];return `<section><h2>Estação ${i+1} — ${e.titulo}</h2><p>Acertos: ${s.respostas.filter(r=>r.correta).length}/${CONFIG.questoesPorEstacao} · Atividade: ${s.textoConcluido?'concluída':'pendente'}</p>${e.questoes.map((q,j)=>{const r=s.respostas[j];return `<div class="question"><h3>Questão ${j+1} — ${q[0]}</h3>${q[1].map((a,k)=>'<p>'+String.fromCharCode(65+k)+'. '+a+'</p>').join('')}<p><b>Alternativa marcada:</b> ${r.escolha===null?'Sem resposta':String.fromCharCode(65+r.escolha)+'. '+q[1][r.escolha]}<br><b>Alternativa correta:</b> ${String.fromCharCode(65+q[2])}. ${q[1][q[2]]}<br><b>Resultado:</b> ${r.correta?'Correta':'Incorreta'} · <b>Tempo da questão:</b> ${formatarTempo(r.tempoMs)}</p><p><b>Explicação:</b> ${q[3]}</p></div>`}).join('')}<section class="writing"><h3>Atividade escrita — resposta integral</h3><p><b>Proposta:</b> ${e.atividade}</p><p>Caracteres: ${s.texto.length} · Tempo de escrita: ${formatarTempo(s.tempoAtividadeMs)}</p><div class="student-text">${esc(s.texto)}</div></section></section>`}).join('')}<footer>Este documento registra a resposta enviada pelo estudante.<br>Professor Magno Vieira dos Santos · Gerado em ${data(new Date().toISOString())}</footer></body></html>`}
function montarDocumentoImpressao(){const w=window.open('','_blank');if(!w){toast('Permita a abertura da janela de impressão neste navegador e tente novamente.');return}w.document.open();w.document.write(documentoImpressao());w.document.close();w.focus();w.setTimeout(()=>w.print(),300)}
load();lastTick=Date.now();tick();render();setInterval(()=>{tick();hud();if(state.iniciadoEm&&!state.finalizadoEm)save()},1000);
</script></body></html>
